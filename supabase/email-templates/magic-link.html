<!-- Paste into Supabase -> Authentication -> Email Templates -> Magic Link (subject: "Your TIMELINER sign-in code"). Needs custom SMTP (Resend) first. -->
<div style="font-family: Arial, sans-serif; max-width: 420px; margin: 0 auto; color: #1A1A2E">
  <h2 style="margin: 0 0 12px">Your TIMELINER sign-in code</h2>
  <p style="margin: 0 0 16px">Type this code in the app:</p>
  <p style="font-size: 34px; font-weight: bold; letter-spacing: 8px; margin: 0 0 16px">{{ .Token }}</p>
  <p style="margin: 0; color: #5F5A78">It works for one hour. If you didn't ask for it, ignore this email.</p>
</div>
